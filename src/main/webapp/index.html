<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Введення даних - Лабораторна 3</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        form { max-width: 300px; padding: 20px; border: 1px solid #ccc; border-radius: 5px; }
        input { width: 100%; padding: 5px; margin-bottom: 10px; }
        button { padding: 8px 15px; cursor: pointer; }
    </style>
</head>
<body>
<h2>Параметри табулювання</h2>
<form action="calculate" method="post">
    <label>Початок інтервалу:</label>
    <input type="number" step="0.001" name="start" value="0.0" required>

    <label>Кінець інтервалу:</label>
    <input type="number" step="0.001" name="end" value="2.0" required>

    <label>Крок (Δx):</label>
    <input type="number" step="0.001" name="step" value="0.002" required>

    <button type="submit">Обчислити</button>
</form>
</body>
</html>
